[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ⚠️ CRITICAL: Child process shutdown timeout
childlogdir=/var/log/supervisor

[program:octane]
process_name=%(program_name)s_%(process_num)02d
command=/bin/bash -c "php /var/www/artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --watch --workers=auto --task-workers=auto --max-requests=500"
user=www-data
directory=/var/www
autostart=true
autorestart=true
; ⚠️ PENTING: restart hanya setelah crash, bukan exit normal
autorestart=unexpected
; ⚠️ Tunggu lebih lama sebelum restart
startsecs=10
startretries=3
; ⚠️ Beri waktu graceful shutdown yang cukup
stopwaitsecs=30
stopsignal=TERM
; ⚠️ Kill setelah timeout
killasgroup=true
stopasgroup=true

; Logging
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true

; ⚠️ Environment variables
environment=
    HOME="/home/www-data",
    USER="www-data",
    ; Critical untuk Octane stability
    OCTANE_MAX_REQUESTS="500",
    OCTANE_WORKERS="auto"

; ⚠️ Exit codes yang tidak perlu di-restart
exitcodes=0,2

[program:horizon]
process_name=%(program_name)s
command=php /var/www/artisan horizon
user=www-data
directory=/var/www
autostart=true
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=30
stopsignal=TERM

stdout_logfile=/var/log/supervisor/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/horizon-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while true; do php /var/www/artisan schedule:run --verbose --no-interaction && sleep 60; done"
user=www-data
directory=/var/www
autostart=true
autorestart=true
startsecs=5
startretries=999 ; ⚠️ Scheduler harus selalu restart
stopwaitsecs=10
stopsignal=TERM

stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/scheduler-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:init-script]
process_name=%(program_name)s
command=/bin/bash -c "/var/www/docker/scripts/init.sh"
user=root
directory=/var/www
autostart=true
autorestart=false ; ⚠️ Hanya jalankan sekali
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
exitcodes=0

[eventlistener:process-ready]
command=/bin/bash -c 'echo "🚀 Laravel Octane is ready and accepting connections on port 8000" && echo "📊 Supervisor processes: octane, horizon, scheduler"'
events=PROCESS_STATE_RUNNING